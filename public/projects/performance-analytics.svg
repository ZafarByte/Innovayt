  <defs>
    <linearGradient id="canvas" x1="61" y1="46" x2="924" y2="781" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6E9DF"/>
      <stop offset="1" stop-color="#D3D8CC"/>
    </linearGradient>
    <linearGradient id="panel" x1="138" y1="93" x2="873" y2="729" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202520"/>
      <stop offset="1" stop-color="#111511"/>
    </linearGradient>
    <linearGradient id="area" x1="543" y1="344" x2="543" y2="581" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4F13C" stop-opacity=".3"/>
      <stop offset="1" stop-color="#C4F13C" stop-opacity="0"/>
    </linearGradient>
    <style>
      .metric-card {
        opacity: 0;
        animation: dashboard-enter .55s cubic-bezier(.22,.8,.2,1) forwards;
      }
      .metric-card-two { animation-delay: .12s; }
      .metric-card-three { animation-delay: .24s; }
      .chart-area {
        opacity: 0;
        animation: area-reveal .9s ease-out .45s forwards;
      }
      .chart-line {
        stroke-dasharray: 650;
        stroke-dashoffset: 650;
        animation: line-draw 1.55s cubic-bezier(.22,.8,.2,1) .35s forwards;
      }
      .chart-previous {
        opacity: 0;
        animation: area-reveal .65s ease-out 1.25s forwards;
      }
      .channel-one, .channel-two, .channel-three {
        transform-box: fill-box;
        transform-origin: left center;
        transform: scaleX(0);
        animation: channel-fill .7s cubic-bezier(.22,.8,.2,1) forwards;
      }
      .channel-one { animation-delay: 1.05s; }
      .channel-two { animation-delay: 1.2s; }
      .channel-three { animation-delay: 1.35s; }
      @keyframes dashboard-enter {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes line-draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes area-reveal {
        to { opacity: 1; }
      }
      @keyframes channel-fill {
        to { transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .metric-card, .chart-area, .chart-previous, .channel-one, .channel-two, .channel-three {
          animation: none;
          opacity: 1;
          transform: none;
        }
        .chart-line {
          animation: none;
          stroke-dasharray: none;
          stroke-dashoffset: 0;
        }
      }
    </style>
